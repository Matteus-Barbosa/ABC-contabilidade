<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABC Accounting Office</title>
    <!--font-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
    <!--css-->
    <link rel="stylesheet" href="styles/style.css">
</head>

<body>
    <section class="hero">
        
        <div class="hero__main spacing flex-col-nowrap gap-16">
            
            <div class="hero__content flex-col-nowrap gap-16">
                <p class="hero__subtitle">ABC Accounting Office</p>
                
                <h1 class="hero__title">Your Finance Partner for Digital Growth</h1>
                
                <p class="hero__description">We help freelancers and startups keep more of what they earn through smart tax planning, streamlined bookkeeping, and expert compliance management.</p>
            </div>
            
            <img class="hero__img" src="imgs/hero.svg" alt="accoutant-working">
            
            <div class="hero__btns flex-col-nowrap">
                <button class="hero__btn hero__btn--primary" id="openModal">Request a Consultation</button>
                
                <a class="hero__btn hero__btn--link" href="#">Tax Calculator</a>
            </div>
            
        </div>
        
        <nav class="menu flex-row-nowrap">
            <a href="#">Freelancer</a>
            <a href="#">Startup</a>
            <a href="#">About us</a>
        </nav>
    </section>
    <!--scripts-->
    <script src="https://kit.fontawesome.com/6e4a791159.js" crossorigin="anonymous"></script>
</body>

</html>
